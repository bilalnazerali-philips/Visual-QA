name: Package QA CLI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package-windows-qa-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test, validate, and package
        shell: pwsh
        run: ./scripts/New-QARelease.ps1
      - name: Publish QA package
        uses: actions/upload-artifact@v4
        with:
          name: VisualQa-QA-win-x64
          path: qa-release/VisualQa-QA-win-x64.zip
          if-no-files-found: error
